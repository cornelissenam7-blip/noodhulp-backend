services:
  - type: web
    name: offertetool-maandincasso-qa
    runtime: node
    plan: free
    region: frankfurt
    branch: offertetool-maandincasso-qa
    autoDeployTrigger: 'off'
    buildCommand: node --check offertetool-monthly.mjs
    healthCheckPath: /health
    startCommand: >-
      node -e 'const http=require("node:http");const key=(process.env.AMCINOVA_MOLLIE_TEST_API_KEY||"").trim();async function status(){if(!key)return "missing";if(!/^test_[A-Za-z0-9]+$/.test(key))return "invalid_test_key_format";try{const response=await fetch("https://api.mollie.com/v2/methods?sequenceType=first",{headers:{Authorization:"Bearer "+key},redirect:"error",signal:AbortSignal.timeout(8000)});await response.body?.cancel();return response.ok?"accepted_by_mollie":response.status===401||response.status===403?"rejected_by_mollie":"mollie_http_"+response.status}catch{return "mollie_unreachable"}}http.createServer(async(req,res)=>{if(req.method!=="GET"||req.url!=="/health"){res.writeHead(404).end();return}res.writeHead(200,{"Content-Type":"application/json","Cache-Control":"no-store"}).end(JSON.stringify({ok:true,mode:"test",testKeyStatus:await status()}))}).listen(Number(process.env.PORT)||10000,"0.0.0.0");'
    envVars:
      - key: AMCINOVA_MOLLIE_TEST_API_KEY
        fromService:
          type: web
          name: noodhulp-backend
          envVarKey: AMCINOVA_MOLLIE_TEST_API_KEY
