services:
  - type: web
    name: offertetool-maandincasso-qa
    runtime: node
    plan: free
    region: frankfurt
    branch: offertetool-maandincasso-qa
    autoDeployTrigger: 'off'
    buildCommand: node --check mollie-monthly-qa.mjs
    healthCheckPath: /health
    startCommand: node mollie-monthly-qa.mjs
    envVars:
      - key: AMCINOVA_MOLLIE_TEST_API_KEY
        fromService:
          type: web
          name: noodhulp-backend
          envVarKey: AMCINOVA_MOLLIE_TEST_API_KEY

